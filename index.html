<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First JS Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #f0f0f0;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    #counter {
      font-size: 24px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Click Counter</h1>
  <button id="myButton">Click me!</button>
  <p id="counter">You've clicked 0 times</p>

  <script>
    // Step 1: find the elements on the page
    const button = document.getElementById('myButton');
    const counterText = document.getElementById('counter');

    // Step 2: keep track of how many times it's been clicked
    let clickCount = 0;

    // Step 3: listen for clicks and react
    button.addEventListener('click', () => {
      clickCount++;
      counterText.textContent = `You've clicked ${clickCount} times`;

      // bonus: change color every 5 clicks
      if (clickCount % 5 === 0) {
        document.body.style.backgroundColor =
          '#' + Math.floor(Math.random() * 16777215).toString(16);
      }
    });
  </script>

</body>
</html>
